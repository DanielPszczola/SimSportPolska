       Przy dodaniu nowego pliku js/ dopisz go tutaj (pliki tylko dla trybu demo celowo pominięte). -->

<body>
  <div id="app"><div class="boot">Ładowanie…</div></div>
  <script>
    // Diagnostyka startu: zamiast wiecznego "Ładowanie…" pokaż, dlaczego strona się nie uruchomiła.
    (function () {
      function fail(msg) {
        var app = document.getElementById('app');
        if (!app || !app.querySelector('.boot')) return; // aplikacja już działa
        app.innerHTML = '<div class="boot-error"><h2>Strona nie uruchomiła się</h2><p>' + msg + '</p>' +
          '<p>Spróbuj: <b>Ctrl+F5</b> (odświeżenie bez pamięci podręcznej). Lokalnie uruchamiaj podgląd poleceniem ' +
          '<code>python tools/serve.py</code> i otwieraj <code>http://localhost:8000</code>.</p></div>';
      }
      if (location.protocol === 'file:') {
        return fail('Plik został otwarty bezpośrednio z dysku (file://) — przeglądarka blokuje wtedy moduły JavaScript.');
      }
      window.addEventListener('error', function (e) {
        // reagujemy tylko na błędy skryptów, nie na nieudane wczytanie czcionki czy obrazka
        if (e.target && e.target.tagName && e.target.tagName !== 'SCRIPT') return;
        fail('Błąd: ' + (e.message || 'nie udało się wczytać pliku ' + (e.target && (e.target.src || e.target.href) || '')));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        fail('Błąd: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      setTimeout(function () { fail('Aplikacja nie wystartowała w ciągu 15 sekund. Sprawdź połączenie z internetem i konsolę przeglądarki (F12).'); }, 15000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
